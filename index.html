<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>¿Quieres ser mi Chinita? 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Poppins', system-ui, sans-serif;
      background: linear-gradient(135deg, #ffd6e8, #fff0f6);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 2rem;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      max-width: 360px;
      width: 90%;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
      color: #ff4d88;
    }

    img {
      width: 220px;
      height: auto;
      border-radius: 16px;
      margin-bottom: 1.5rem;
    }

    .buttons {
      position: relative;
      height: 120px;
    }

    button {
      border: none;
      padding: 0.8rem 1.5rem;
      font-size: 1.1rem;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #yesBtn {
      background: #ff4d88;
      color: white;
      box-shadow: 0 8px 20px rgba(255,77,136,0.4);
    }

    #yesBtn:hover {
      transform: scale(1.08);
    }

    #noBtn {
      position: absolute;
      background: #ddd;
      color: #555;
      left: 50%;
      top: 60%;
      transform: translate(-50%, -50%);
    }

    .footer {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #999;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 id="title">¿Quieres ser mi CHINITA? 💖</h1>

    <!-- GIF normal -->
    <img
      id="puppy"
      src="https://media.giphy.com/media/v6aOjy0Qo1fIA/giphy.gif"
      alt="Cachorro tierno"
    />

    <div class="buttons">
      <button id="yesBtn">Sí 💕</button>
      <button id="noBtn">No 😒</button>
    </div>

    <div class="footer">
      Hecho con amor y cero opciones reales 😌
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const puppy = document.getElementById("puppy");
    const title = document.getElementById("title");

    function moveNoButton() {
      const x = Math.random() * 80;
      const y = Math.random() * 80;
      noBtn.style.left = x + "%";
      noBtn.style.top = y + "%";
    }

    // Desktop
    noBtn.addEventListener("mouseenter", moveNoButton);

    // Mobile
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moveNoButton();
    });

    yesBtn.addEventListener("click", () => {
      title.textContent = "¡¡SABÍA QUE DIRÍAS QUE SÍ!! 💖🥰";
      puppy.src = "https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif";
      yesBtn.disabled = true;
      noBtn.style.display = "none";
    });
  </script>

</body>
</html>
